name: Build All

on:
  workflow_call:
    inputs:
      data_source:
        description: "Use the internal data release or compile the vendored source data"
        required: false
        type: string
        default: release
      app_data_version:
        description: "Application data schema/release version"
        required: false
        type: string
        default: "20"
      app_data_release_tag:
        description: "Internal GitHub Release tag used in release mode"
        required: false
        type: string
        default: data-v20
      publish_data_release:
        description: "Publish the source-built database as a GitHub Release asset"
        required: false
        type: boolean
        default: false
      build_variant:
        description: "Android artifact variant: preview is release-equivalent without a secret signer"
        required: false
        type: string
        default: preview
  workflow_dispatch:
    inputs:
      data_source:
        description: "Data build mode"
        required: true
        type: choice
        options:
          - release
          - source
        default: release
      app_data_version:
        description: "Application data schema/release version"
        required: true
        type: string
        default: "20"
      app_data_release_tag:
        description: "Internal GitHub Release tag used in release mode"
        required: true
        type: string
        default: data-v20
      publish_data_release:
        description: "Publish source-built database to the GitHub Release section"
        required: true
        type: boolean
        default: false
      build_variant:
        description: "Android artifact variant"
        required: true
        type: choice
        options:
          - preview
          - release
        default: preview

concurrency:
  group: build-all-${{ github.workflow }}-${{ github.ref }}-${{ inputs.data_source || 'release' }}-${{ inputs.build_variant || 'preview' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare-app-data:
    name: Prepare application data
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_DATA_SOURCE: ${{ inputs.data_source || 'release' }}
      APP_DATA_VERSION: ${{ inputs.app_data_version || '20' }}
      APP_DATA_RELEASE_TAG: ${{ inputs.app_data_release_tag || 'data-v20' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Restore and save Gradle state
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Prepare and validate application data
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          database_file="database/kanji-dojo-data-base-v${APP_DATA_VERSION}.sql"

          case "$APP_DATA_SOURCE" in
            source)
              ./gradlew :database:exportAppDatabase \
                -PappDataVersion="$APP_DATA_VERSION" \
                --no-daemon --parallel --build-cache --max-workers=4 \
                -Dorg.gradle.workers.max=4 \
                -Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8'
              test -s "$database_file"
              file "$database_file" | grep -F 'SQLite 3.x database'
              test "$(head -c 16 "$database_file")" = 'SQLite format 3'
              sha256sum "$database_file" | tee "${database_file}.sha256"
              ;;
            release)
              echo "Using internal data release $APP_DATA_RELEASE_TAG"
              ;;
            *)
              echo "Unsupported data source: $APP_DATA_SOURCE" >&2
              exit 1
              ;;
          esac

      - name: Upload source-built application data
        if: ${{ env.APP_DATA_SOURCE == 'source' }}
        uses: actions/upload-artifact@v4
        with:
          name: source-app-data-v${{ env.APP_DATA_VERSION }}
          path: |
            database/kanji-dojo-data-base-v${{ env.APP_DATA_VERSION }}.sql
            database/kanji-dojo-data-base-v${{ env.APP_DATA_VERSION }}.sql.sha256
          if-no-files-found: error
          retention-days: 7

  unit-tests:
    name: Android unit tests
    needs: prepare-app-data
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_DATA_SOURCE: ${{ inputs.data_source || 'release' }}
      APP_DATA_VERSION: ${{ inputs.app_data_version || '20' }}
      APP_DATA_RELEASE_TAG: ${{ inputs.app_data_release_tag || 'data-v20' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Restore and save Gradle state
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Download source-built application data
        if: ${{ env.APP_DATA_SOURCE == 'source' }}
        uses: actions/download-artifact@v4
        with:
          name: source-app-data-v${{ env.APP_DATA_VERSION }}
          path: database

      - name: Run Android unit tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :core:testDebugUnitTest \
            -PappDataSource="$APP_DATA_SOURCE" \
            -PappDataVersion="$APP_DATA_VERSION" \
            -PappDataReleaseTag="$APP_DATA_RELEASE_TAG" \
            --no-daemon --parallel --build-cache --max-workers=4 \
            -Dorg.gradle.workers.max=4 \
            -Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8'

      - name: Upload unit test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: core/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn
          retention-days: 7

  build-android-apk:
    name: Optimized Android ${{ inputs.build_variant || 'preview' }} APK
    needs: prepare-app-data
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_DATA_SOURCE: ${{ inputs.data_source || 'release' }}
      APP_DATA_VERSION: ${{ inputs.app_data_version || '20' }}
      APP_DATA_RELEASE_TAG: ${{ inputs.app_data_release_tag || 'data-v20' }}
      BUILD_VARIANT: ${{ inputs.build_variant || 'preview' }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
      SIGN_KEY: ${{ secrets.KEY_ALIAS }}
      SIGN_PASS: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Restore and save Gradle state
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Download source-built application data
        if: ${{ env.APP_DATA_SOURCE == 'source' }}
        uses: actions/download-artifact@v4
        with:
          name: source-app-data-v${{ env.APP_DATA_VERSION }}
          path: database

      - name: Build optimized Android artifact
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          case "$BUILD_VARIANT" in
            preview)
              gradle_task=:app:assemblePreview
              ;;
            release)
              : "${KEYSTORE_BASE64:?Set KEYSTORE_BASE64 from the original release keystore}"
              : "${KEYSTORE_PASS:?Set KEYSTORE_PASSWORD}"
              : "${SIGN_KEY:?Set KEY_ALIAS}"
              : "${SIGN_PASS:?Set KEY_PASSWORD}"
              keystore_path="$RUNNER_TEMP/kaiteyo-release.jks"
              printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
              test -s "$keystore_path"
              export KEYSTORE_PATH="$keystore_path"
              gradle_task=:app:assembleRelease
              ;;
            *)
              echo "Unsupported build variant: $BUILD_VARIANT" >&2
              exit 1
              ;;
          esac
          ./gradlew "$gradle_task" \
            -PappDataSource="$APP_DATA_SOURCE" \
            -PappDataVersion="$APP_DATA_VERSION" \
            -PappDataReleaseTag="$APP_DATA_RELEASE_TAG" \
            --no-daemon --parallel --build-cache --max-workers=4 \
            -Dorg.gradle.workers.max=4 \
            -Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8'

      - name: Verify APK signature and release-equivalent optimization
        shell: bash
        run: |
          set -euo pipefail
          apk_dir="app/build/outputs/apk/$BUILD_VARIANT"
          apk="$(find "$apk_dir" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          test -s "app/build/outputs/mapping/$BUILD_VARIANT/mapping.txt"
          mapfile -t database_assets < <(unzip -Z1 "$apk" | grep -E 'kanji-dojo-data-base-v[0-9]+\\.sql$' || true)
          test "${#database_assets[@]}" -eq 1
          [[ "${database_assets[0]}" == *"kanji-dojo-data-base-v${APP_DATA_VERSION}.sql" ]]
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$apksigner"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk" | tee "$apk_dir/signing-certificate.txt"
          # apksigner labels certificate lines differently across build-tools revisions.
          grep -E '(Signer #[0-9]+ certificate|V[0-9.]+ Signer: certificate) SHA-256 digest:' "$apk_dir/signing-certificate.txt"

      - name: Upload optimized Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.build_variant || 'preview' }}
          path: |
            app/build/outputs/apk/${{ inputs.build_variant || 'preview' }}/*.apk
            app/build/outputs/apk/${{ inputs.build_variant || 'preview' }}/signing-certificate.txt
          if-no-files-found: error
          retention-days: 7

  verify-android-artifact:
    name: Verify Android artifact
    needs:
      - unit-tests
      - build-android-apk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download optimized Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-${{ inputs.build_variant || 'preview' }}
          path: android-artifact

      - name: Verify artifact layout and signing record
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find android-artifact -type f -name '*.apk' -print -quit)"
          signing_record="$(find android-artifact -type f -name 'signing-certificate.txt' -print -quit)"
          test -n "$apk"
          test -n "$signing_record"
          test -s "$signing_record"
          grep -E '(Signer #[0-9]+ certificate|V[0-9.]+ Signer: certificate) SHA-256 digest:' "$signing_record"
          find android-artifact -type f -printf '%P %s bytes\n' | sort

  publish-data-release:
    if: ${{ inputs.data_source == 'source' && (inputs.publish_data_release || false) }}
    needs:
      - prepare-app-data
      - verify-android-artifact
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download source-built application data
        uses: actions/download-artifact@v4
        with:
          name: source-app-data-v${{ inputs.app_data_version || '20' }}
          path: database

      - name: Publish internal data release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: data-v${{ inputs.app_data_version || '20' }}
          name: Internal Kaiteyo Data v${{ inputs.app_data_version || '20' }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: false
          body: |
            Source-built Kaiteyo application database generated from the vendored `database/` source tree.
            The `.sql` extension is retained for application asset compatibility; the artifact is a SQLite database.
          files: |
            database/kanji-dojo-data-base-v${{ inputs.app_data_version || '20' }}.sql
            database/kanji-dojo-data-base-v${{ inputs.app_data_version || '20' }}.sql.sha256
